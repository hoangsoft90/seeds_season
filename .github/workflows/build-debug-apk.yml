# Build Standalone Debug APK — Expo prebuild + Gradle bundling
# APK chạy offline, không cần Metro dev server

name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Fix Kotlin version in react-native version catalogs
        run: |
          for f in \
            node_modules/react-native/gradle/libs.versions.toml \
            node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml; do
            if [ -f "$f" ]; then
              sed -i 's/^kotlin = "1\.9\.24"/kotlin = "1.9.25"/' "$f"
              echo "Patched: $f"
            fi
          done

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Make debug builds include JS bundle (standalone, no Metro)
        run: |
          # Default: debuggableVariants includes "debug" -> debug skips JS bundling
          # Setting to [] means ALL variants bundle JS, making APK standalone
          sed -i 's|//.*debuggableVariants.*|debuggableVariants = []|' android/app/build.gradle
          echo "Patched debuggableVariants to [] (all variants bundle JS)"
          grep "debuggableVariants" android/app/build.gradle

      - name: Force kotlin-stdlib to 1.9.25 for AdMob compatibility
        run: |
          # Root cause: react-native-google-mobile-ads pulls kotlin-stdlib:2.1.0
          # as transitive dependency, but Kotlin compiler 1.9.x can only read
          # metadata up to 2.0.0. This causes "Incompatible classes" build error.
          #
          # Fix: Add resolutionStrategy in root android/build.gradle allprojects block
          # to force ALL Kotlin dependencies to 1.9.25.
          
          ROOT_BUILD="android/build.gradle"
          
          # Check if already patched
          if grep -q "resolutionStrategy" "$ROOT_BUILD" 2>/dev/null; then
            echo "Already patched, skipping"
            exit 0
          fi
          
          if [ ! -f "$ROOT_BUILD" ]; then
            echo "ERROR: $ROOT_BUILD not found"
            exit 1
          fi
          
          # Show the allprojects block location for debugging
          echo "=== Current allprojects block ==="
          grep -n "allprojects" "$ROOT_BUILD" || echo "allprojects not found"
          
          # Strategy: add a new allprojects block BEFORE the existing one
          # (Gradle allows multiple allprojects blocks, last one wins for same keys)
          cat >> "$ROOT_BUILD" << 'GRADLE_EOF'

// Force kotlin-stdlib to 1.9.25 — AdMob (react-native-google-mobile-ads)
// pulls kotlin-stdlib:2.1.0 which is incompatible with Kotlin compiler 1.9.x
allprojects {
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25"
        }
    }
}
GRADLE_EOF
          
          echo "Patched $ROOT_BUILD with kotlin-stdlib resolutionStrategy"
          echo "=== Last 20 lines ==="
          tail -20 "$ROOT_BUILD"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK (with embedded JS bundle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
