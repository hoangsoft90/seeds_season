# Build Debug APK — Expo prebuild + Gradle (no EAS token needed)

name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Debug — show build.gradle and gradle.properties
        run: |
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== android/gradle.properties ==="
          cat android/gradle.properties
          echo ""
          echo "=== expo-modules-core build.gradle (kotlin lines) ==="
          grep -n "kotlin\|1.9" node_modules/expo-modules-core/android/build.gradle 2>/dev/null || echo "(not found)"

      - name: Patch Kotlin version in ALL gradle files
        run: |
          cd android

          # Patch root build.gradle — change ALL kotlin version refs
          sed -i 's/"1\.9\.24"/"1.9.25"/g' build.gradle
          sed -i "s/'1\.9\.24'/'1.9.25'/g" build.gradle
          sed -i 's/1\.9\.24/1.9.25/g' build.gradle

          # Patch expo-modules-core and other Expo modules
          for f in \
            ../node_modules/expo-modules-core/android/build.gradle \
            ../node_modules/expo-modules-core/android/expo-modules-core/build.gradle \
            ../node_modules/expo/android/build.gradle \
            ../node_modules/expo-constants/android/build.gradle \
            ../node_modules/expo-linking/android/build.gradle \
            ../node_modules/expo-splash-screen/android/build.gradle; do
            if [ -f "$f" ]; then
              sed -i 's/1\.9\.24/1.9.25/g' "$f"
            fi
          done

          # Add to gradle.properties
          echo "android.kotlinVersion=1.9.25" >> gradle.properties
          echo "suppressKotlinVersionCompatibilityCheck=true" >> gradle.properties

          echo "=== After patch: build.gradle kotlin refs ==="
          grep -n "1\.9\." build.gradle || echo "(none)"
          echo "=== After patch: expo-modules-core kotlin refs ==="
          grep -rn "1\.9\." ../node_modules/expo-modules-core/android/build.gradle 2>/dev/null | head -5 || echo "(none)"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
