# Build Debug APK — Expo prebuild + Gradle (no EAS token needed)

name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Fix Kotlin 1.9.24 → 1.9.25 for Compose Compiler
        run: |
          cd android

          # 1) Set the Gradle property that expo-modules-core reads via findProperty()
          sed -i '/^android\.useAndroidX/a android.kotlinVersion=1.9.25' gradle.properties

          # 2) Patch root build.gradle ext block
          sed -i 's/kotlinVersion = "1\.9\.24"/kotlinVersion = "1.9.25"/g' build.gradle
          sed -i "s/kotlinVersion = '1\.9\.24'/kotlinVersion = '1.9.25'/g" build.gradle

          # 3) Patch expo-modules-core build.gradle (fallback)
          sed -i "s/'1\.9\.24'/'1.9.25'/g" ../node_modules/expo-modules-core/android/build.gradle 2>/dev/null || true

          echo "=== gradle.properties ==="
          grep -i kotlin gradle.properties
          echo "=== root build.gradle ==="
          grep -i kotlin build.gradle || echo "(none)"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
