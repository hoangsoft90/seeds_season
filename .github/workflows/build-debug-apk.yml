# Build Debug APK - GitHub Actions workflow
#
# Trigger: push to main branch hoac manual dispatch.
# Build debug APK bang Gradlu truc tiep (khong can EAS token).
# Artifact: app-debug.apk duoc upload de download.

name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Cho phep trigger thu cong tu GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Create placeholder web assets for Capacitor
        run: |
          mkdir -p out
          cat > out/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="vi">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trong Gi Hom Nay</title></head>
          <body><p>Loading...</p></body>
          </html>
          HTMLEOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK file
        id: find-apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 7
          if-no-files-found: error
