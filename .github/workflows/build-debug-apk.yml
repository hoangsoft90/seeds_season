# Build Debug APK via EAS Build (Expo Application Services)
#
# Trigger: push to main or manual dispatch.
# Uses EAS to build APK — no local Android SDK needed.
# Requires EXPO_TOKEN secret in GitHub repo settings.

name: Build Debug APK (EAS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup Expo credentials
        run: |
          eas login --token ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK (preview profile)
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait

      - name: Get build URL
        run: |
          echo "🔗 EAS Build triggered. Check https://expo.dev for build status."
          echo "Download APK from EAS dashboard after build completes."
