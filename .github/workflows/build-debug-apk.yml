# Build Debug APK — Expo prebuild + Gradle (no EAS token needed)

name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Fix Kotlin 1.9.24 → 1.9.25 for Compose Compiler
        run: |
          # Patch expo-modules-core to use Kotlin 1.9.25
          sed -i 's/"1\.9\.24"/"1.9.25"/g' \
            node_modules/expo-modules-core/android/build.gradle \
            node_modules/expo/android/build.gradle \
            node_modules/expo-constants/android/build.gradle \
            node_modules/expo-linking/android/build.gradle \
            node_modules/expo-splash-screen/android/build.gradle \
            node_modules/expo-modules-core/android/expo-annotations/build.gradle \
            node_modules/expo-modules-core/android/expo-modules-core/build.gradle \
            2>/dev/null || true

          # Also patch the root build.gradle kotlinVersion
          sed -i 's/kotlinVersion = "1\.9\.24"/kotlinVersion = "1.9.25"/g' \
            android/build.gradle 2>/dev/null || true

          # Verify
          echo "=== Verify Kotlin version in expo-modules-core ==="
          grep -r "1.9.24\|1.9.25" node_modules/expo-modules-core/android/build.gradle 2>/dev/null || echo "(file not found)"
          grep "kotlinVersion" android/build.gradle 2>/dev/null || echo "(no match in root build.gradle)"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
