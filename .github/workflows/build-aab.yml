# Build Release AAB — exact clone of Debug APK workflow

name: Build AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Fix Kotlin version in react-native version catalogs
        run: |
          for f in \
            node_modules/react-native/gradle/libs.versions.toml \
            node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml; do
            if [ -f "$f" ]; then
              sed -i 's/^kotlin = "1\.9\.24"/kotlin = "1.9.25"/' "$f"
              echo "Patched: $f"
            fi
          done

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Make builds include JS bundle (standalone, no Metro)
        run: |
          sed -i 's|//.*debuggableVariants.*|debuggableVariants = []|' android/app/build.gradle
          echo "Patched debuggableVariants"
          grep "debuggableVariants" android/app/build.gradle

      - name: Force play-services-ads to 23.x for Kotlin 1.9.x compat
        run: |
          ROOT_BUILD="android/build.gradle"
          if [ ! -f "$ROOT_BUILD" ]; then
            echo "ERROR: $ROOT_BUILD not found"
            exit 1
          fi
          if grep -q "resolutionStrategy" "$ROOT_BUILD" 2>/dev/null; then
            echo "Already patched, skipping"
            exit 0
          fi
          echo "" >> "$ROOT_BUILD"
          echo "allprojects {" >> "$ROOT_BUILD"
          echo "    configurations.all {" >> "$ROOT_BUILD"
          echo "        resolutionStrategy {" >> "$ROOT_BUILD"
          echo "            force \"com.google.android.gms:play-services-ads:23.6.0\"" >> "$ROOT_BUILD"
          echo "            force \"org.jetbrains.kotlin:kotlin-stdlib:1.9.25\"" >> "$ROOT_BUILD"
          echo "            force \"org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25\"" >> "$ROOT_BUILD"
          echo "            force \"org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25\"" >> "$ROOT_BUILD"
          echo "            force \"org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25\"" >> "$ROOT_BUILD"
          echo "        }" >> "$ROOT_BUILD"
          echo "    }" >> "$ROOT_BUILD"
          echo "}" >> "$ROOT_BUILD"
          echo "Patched $ROOT_BUILD"

      - name: Decode keystore into /tmp
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > /tmp/release.keystore

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build release AAB (signed with release keystore)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_KEYSTORE_PASS }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEYSTORE_PASS }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
          if-no-files-found: error
