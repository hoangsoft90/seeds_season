name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Golden Test Cases như regression suite — engine đổi là phải chạy lại toàn bộ
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Golden Test Cases
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
