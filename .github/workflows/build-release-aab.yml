# Build Release AAB — Expo prebuild + Gradle bundling (Google Play)
name: Build Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Fix Kotlin version
        run: |
          for f in \
            node_modules/react-native/gradle/libs.versions.toml \
            node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml; do
            if [ -f "$f" ]; then
              sed -i 's/^kotlin = "1\.9\.24"/kotlin = "1.9.25"/' "$f"
            fi
          done

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Disable Sentry
        run: |
          cd android/app
          sed -i 's|id "@sentry/react-native"|// id "@sentry/react-native"|' build.gradle 2>/dev/null || true
          sed -i '/sentry.gradle/d' build.gradle 2>/dev/null || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Keystore decoded"
          fi

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f android/app/release.keystore ]; then
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=release.keystore" >> android/key.properties
            echo "key.properties created"
          fi

      - name: Patch debuggableVariants
        run: sed -i 's|//.*debuggableVariants.*|debuggableVariants = []|' android/app/build.gradle

      - name: Force play-services-ads to 23.x
        run: |
          ROOT_BUILD="android/build.gradle"
          if ! grep -q "resolutionStrategy" "$ROOT_BUILD" 2>/dev/null; then
            cat >> "$ROOT_BUILD" << 'GRADLEOF'
          
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force "com.google.android.gms:play-services-ads:23.6.0"
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25"
                      force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25"
                  }
              }
          }
          GRADLEOF
          fi

      - name: Configure release signing
        run: |
          if [ -f android/key.properties ]; then
            cd android/app
            python3 "$GITHUB_WORKSPACE/scripts/inject-signing.py"
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build release AAB
        env:
          SENTRY_SOURCEMAPS_ENABLE: "false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error
