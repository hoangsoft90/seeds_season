<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient: emerald green -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <!-- Leaf gradient -->
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  
  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>
  
  <!-- Stem -->
  <path d="M256 380 L256 220" stroke="url(#leaf)" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Left leaf -->
  <path d="M256 280 Q200 240 180 180 Q220 200 256 260" fill="url(#leaf)" opacity="0.9"/>
  
  <!-- Right leaf -->
  <path d="M256 250 Q310 210 330 150 Q290 190 256 230" fill="url(#leaf)" opacity="0.9"/>
  
  <!-- Top sprout -->
  <path d="M256 220 Q256 180 240 150 Q260 170 256 200" fill="url(#leaf)" opacity="0.8"/>
  
  <!-- Small soil mound -->
  <ellipse cx="256" cy="385" rx="60" ry="15" fill="#92400e" opacity="0.6"/>
  
  <!-- Sparkle dots -->
  <circle cx="190" cy="160" r="6" fill="#ffffff" opacity="0.7"/>
  <circle cx="320" cy="140" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="170" cy="220" r="3" fill="#ffffff" opacity="0.4"/>
</svg>
